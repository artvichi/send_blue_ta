name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub OIDC exchanged for a short-lived IAM role. No long-lived AWS keys exist
# in this repository or in its secrets.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      # Tagged by commit SHA, never by `latest`: a deployment must name exactly
      # one immutable image.
      - name: Build and push server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/sbta-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: VITE_API_URL=${{ secrets.PUBLIC_API_URL }}
          tags: ${{ steps.ecr.outputs.registry }}/sbta-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  plan:
    runs-on: ubuntu-latest
    needs: images
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate

      # Deliberately stops at plan. Applying is a manual, reviewed step.
      - run: terraform -chdir=infra plan -var-file=env/prod.tfvars -var="image_tag=${{ github.sha }}"
        continue-on-error: true
