# The whole stack in containers, for a reviewer who would rather not install
# anything. The gateway is deliberately absent -- it needs macOS APIs and a
# signed-in Apple account, so it always runs natively on the host.
#
#   docker compose -f docker-compose.yml -f docker-compose.full.yml up --build

services:
  # Migrations run once, as their own job, rather than from every app replica on
  # boot -- that keeps the Prisma CLI (and Studio, and its dev tooling) out of
  # the runtime image entirely, and means N replicas do not race on startup.
  migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: build
    working_dir: /repo
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sbta}:${POSTGRES_PASSWORD:-sbta}@postgres:5432/${POSTGRES_DB:-sbta}?schema=public
    command: >-
      npx prisma migrate deploy
      --schema apps/server/prisma/schema.prisma
      --config apps/server/prisma.config.ts
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sbta}:${POSTGRES_PASSWORD:-sbta}@postgres:5432/${POSTGRES_DB:-sbta}?schema=public
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:-dev-gateway-token-change-me}
      CORS_ORIGIN: http://localhost:4330
      NODE_ENV: production
      PORT: 4310
    ports:
      - '4310:4310'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:4310
    ports:
      - '4330:80'
    depends_on:
      - server
